[package]
name = "openstart"
version = "1.0.9"
description = "Startup command launcher for Windows"
authors = ["you"]
license = "MIT"
repository = "https://github.com/purejiang/openstart"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
winreg = "0.52"
log = "0.4"
dirs = "5"
ureq = { version = "2", features = ["json"] }
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Wdk_System_Threading"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# MSVC 14.41 can fail with D8050 ("failed to put command line into debug
# record") while compiling the C parts of these crates with /Z7. Disable debug
# info for their native build scripts; pdao uses the same workaround for SQLite.
[profile.dev.package.ring]
debug = false

[profile.dev.package.libsqlite3-sys]
debug = false
